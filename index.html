    <!-- PWA Meta Tags for Admin -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- PWA Manifest Switcher - runs before page load -->
    <script>
      (function() {
        const path = window.location.pathname;
        const isAdmin = path.startsWith('/admin');
        
        // Remove existing manifest if any
        const existing = document.querySelector('link[rel="manifest"]');
        if (existing) existing.remove();
        
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = isAdmin ? '/admin-manifest.json?v=3' : '/manifest.webmanifest';
        document.head.appendChild(manifestLink);
        
        // Update theme color for admin
        let themeColorMeta = document.querySelector('meta[name="theme-color"]');
        if (!themeColorMeta) {
          themeColorMeta = document.createElement('meta');
          themeColorMeta.name = 'theme-color';
          document.head.appendChild(themeColorMeta);
        }
        themeColorMeta.content = isAdmin ? '#000000' : '#f97316';
        
        // Update apple-mobile-web-app-title for admin
        let appleTitleMeta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (!appleTitleMeta) {
          appleTitleMeta = document.createElement('meta');
          appleTitleMeta.name = 'apple-mobile-web-app-title';
          document.head.appendChild(appleTitleMeta);
        }
        appleTitleMeta.content = isAdmin ? 'Admin TOP' : 'Quiz TOP Brasil';
        
        console.log('📱 PWA configurado para:', isAdmin ? 'Admin Dashboard' : 'Quiz', '| Manifest:', manifestLink.href);
      })();
    </script>
